<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Clarim Diário</title>

    <link rel="stylesheet" href="../css/main.css">

    <script src="../JS/components/site-header.js" defer></script>
    <script src="../JS//components/site-footer.js" defer></script>
</head>

<body>
    <site-header></site-header>
    <main class="principal-form">
        <form id="form-login" class="form">
            <h1>Entrar</h1>
            <label for="email">E-mail</label>
            <input type="email" name="email" id="email" required>

            <label for="senha">Senha</label>
            <input type="password" name="senha" id="senha" required>

            <p id="aviso"></p>

            <button type="submit" class="btn">Entrar</button>

            <p class="rodapeform">Não tem conta? <a href="./cadastro.html">Cadastre-se</a></p>
        </form>
    </main>
    <script type="module" src="../JS/login.js"></script>
</body>
</body>

</html>
